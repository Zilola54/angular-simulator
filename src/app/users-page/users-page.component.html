<app-users-filter (search)="onSearch($event)"></app-users-filter>
<app-user-create (create)="onUserCreate($event)"></app-user-create>

<hr> 

<div class="users-container">
  @for (currentUser of filteredUsers$ | async; track currentUser.id) {

  <app-user-card [user]="currentUser" (delete)="onDeleteUser($event)"></app-user-card>
  } @empty {
    <p class="no-users">НЕТ ПОЛЬЗОВАТЕЛЕЙ ДЛЯ ИЗОБРАЖЕНИЯ</p>
  }
</div>
